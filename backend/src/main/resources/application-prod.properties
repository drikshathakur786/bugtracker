spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# --- Connection Pool (HikariCP) - handles Neon cold starts ---
# Wait up to 60s for a connection (Neon cold start can take a few seconds)
spring.datasource.hikari.connection-timeout=60000
# Keep idle connections alive for 10 min
spring.datasource.hikari.idle-timeout=600000
# Max lifetime of a connection: 30 min
spring.datasource.hikari.max-lifetime=1800000
# Minimum idle connections in pool
spring.datasource.hikari.minimum-idle=1
# Max pool size (keep small for free tier)
spring.datasource.hikari.maximum-pool-size=5
# Send a keepalive query every 2 min to prevent Neon from sleeping
spring.datasource.hikari.keepalive-time=120000
# Retry on connection failure
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# Defer database initialization until first request (faster startup)
spring.jpa.defer-datasource-initialization=true

server.port=${PORT:8080}
server.servlet.context-path=/api

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000